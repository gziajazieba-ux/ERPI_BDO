name: Generate MAPA_PROJEKTU_AI

on:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate MAPA_PROJEKTU_AI.txt
        shell: bash
        run: |
          set -e

          OUTPUT="MAPA_PROJEKTU_AI.txt"
          MAX_LINES=30

          REPO_FULL="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"

          RAW_BASE="https://raw.githubusercontent.com/${REPO_FULL}/${BRANCH}"
          BLOB_BASE="https://github.com/${REPO_FULL}/blob/${BRANCH}"

          # ===== CZASY =====
          UTC_TIME=$(date -u +'%Y-%m-%d %H:%M:%S')
          PL_TIME=$(TZ=Europe/Warsaw date +'%Y-%m-%d %H:%M:%S')

          echo "### MAPA PROJEKTU AI ###" > "$OUTPUT"
          echo "Repo: https://github.com/${REPO_FULL}" >> "$OUTPUT"
          echo "Gałąź: ${BRANCH}" >> "$OUTPUT"
          echo "Ostatnia aktualizacja: ${UTC_TIME} UTC | ${PL_TIME} CET" >> "$OUTPUT"
          echo "Commit HEAD: $(git rev-parse --short HEAD)" >> "$OUTPUT"
          echo "--------------------------------------------------" >> "$OUTPUT"
          echo "" >> "$OUTPUT"

          find . -type f \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            ! -name "$OUTPUT" \
            | sort | while read FILE; do

              REL_PATH="/${FILE#./}"
              SIZE=$(stat -c%s "$FILE")
              MTIME=$(stat -c "%y" "$FILE" | cut -d'.' -f1)
              HASH=$(sha1sum "$FILE" | cut -d' ' -f1)
              COMMIT=$(git log -n 1 --pretty=format:%h -- "$FILE" || echo "brak")

              RAW_URL="${RAW_BASE}${REL_PATH}"
              BLOB_URL="${BLOB_BASE}${REL_PATH}"

              echo "[PLIK]" >> "$OUTPUT"
              echo "Ścieżka repo: ${REL_PATH}" >> "$OUTPUT"
              echo "Rozmiar (B): ${SIZE}" >> "$OUTPUT"
              echo "Ostatnia modyfikacja pliku: ${MTIME}" >> "$OUTPUT"
              echo "Hash (SHA1): ${HASH}" >> "$OUTPUT"
              echo "Ostatni commit pliku: ${COMMIT}" >> "$OUTPUT"
              echo "Link GitHub: ${BLOB_URL}" >> "$OUTPUT"
              echo "Link RAW: ${RAW_URL}" >> "$OUTPUT"
              echo "" >> "$OUTPUT"

              echo "Wyciąg (pierwsze ${MAX_LINES} linii):" >> "$OUTPUT"
              echo '"""' >> "$OUTPUT"
              head -n ${MAX_LINES} "$FILE" >> "$OUTPUT" || true
              echo '"""' >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              echo "--------------------------------------------------" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
          done

      - name: Commit and push MAPA_PROJEKTU_AI.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add MAPA_PROJEKTU_AI.txt
          git commit -m "Auto-update MAPA_PROJEKTU_AI.txt" || exit 0
          git push
