name: Generate Project Map
on:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: # Dodatkowe zabezpieczenie uprawnień wewnątrz skryptu
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Zaktualizowana wersja akcji
        with:
          fetch-depth: 0

      - name: Generate File List
        run: |
          export TZ="Europe/Warsaw"
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          FILENAME="mapa_projektu_${TIMESTAMP}.txt"
          
          rm -f mapa_projektu_*.txt
          
          echo "### Mapa plików Raw (Generacja: $(date +'%Y-%m-%d %H:%M:%S')) ###" > $FILENAME
          echo "----------------------------------------------------------" >> $FILENAME
          
          # Automatyczne wykrywanie nazwy repozytorium i gałęzi
          REPO_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}"
          
          find . -type f -not -path '*/.*' -not -name "mapa_projektu_*.txt" | sed "s|^\./|$REPO_URL/|" >> $FILENAME

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mapa_projektu_*.txt
          # Jeśli nie ma zmian, skrypt po prostu skończy bez błędu
          git commit -m "Auto-update map: $(date +'%H:%M:%S')" || exit 0
          git push