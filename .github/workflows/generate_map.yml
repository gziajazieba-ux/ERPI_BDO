name: Generate Project Map
on:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate File List
        run: |
          export TZ="Europe/Warsaw"
          # Stała nazwa pliku dla porządku
          FILENAME="mapa_projektu.txt"
          
          echo "### Mapa plików Raw ###" > $FILENAME
          echo "Ostatnia aktualizacja: $(date +'%Y-%m-%d %H:%M:%S')" >> $FILENAME
          echo "----------------------------------------------------------" >> $FILENAME
          
          REPO_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}"
          find . -type f -not -path '*/.*' -not -name "$FILENAME" | sed "s|^\./|$REPO_URL/|" >> $FILENAME

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mapa_projektu.txt
          # Skrypt teraz nadpisuje ten sam plik
          git commit -m "Auto-update project map" || exit 0
          git push